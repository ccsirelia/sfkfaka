# Include these locations inside the existing HTTPS server block for sfkfaka.xyz.
# Preserve /kmdh in the upstream request: proxy_pass must NOT end with a slash.
location = /kmdh {
    return 308 /kmdh/$is_args$args;
}

location ^~ /kmdh/ {
    client_max_body_size 512k;
    proxy_pass http://127.0.0.1:3200;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
